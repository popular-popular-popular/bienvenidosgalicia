<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="116mm" height="185mm" viewBox="0 0 116 185">

  <defs>
    <linearGradient id="gradFront" x1="0" y1="0" x2="0.75" y2="1">
      <stop offset="0%" stop-color="#29224f"/>
      <stop offset="42%" stop-color="#5b2751"/>
      <stop offset="100%" stop-color="#ef3020"/>
    </linearGradient>
    <linearGradient id="gradBack" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#29224f"/>
      <stop offset="44%" stop-color="#6b2850"/>
      <stop offset="100%" stop-color="#ef3020"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- =========================================================
       HOJA: 116 x 185 mm
       DOS TARJETAS VERTICALES, 53.98 x 85.60 mm cada una.
       Todos los textos y formas principales son objetos vectoriales.
       ========================================================= -->

  <g inkscape:groupmode="layer" inkscape:label="FRONTAL" id="layerFront">
    <!-- Tarjeta frontal: x=5, y=5, w=53.98, h=85.60 -->
    <rect x="5" y="5" width="53.98" height="85.60" rx="3.2"
          fill="url(#gradFront)" filter="url(#softShadow)"/>

    <!-- Franja plateada lateral -->
    <rect x="49.55" y="5" width="4.90" height="85.60" fill="#e8e8e5"/>
    <rect x="49.55" y="5" width="0.35" height="85.60" fill="#cfcfca"/>

    <!-- Ave / icono decorativo vectorial -->
    <g id="iconoAve" transform="translate(10.2 10.8)">
      <path d="M0,5.8 C1.9,1.1 5.1,-0.2 8.2,1.6
               C6.6,1.7 5.4,2.8 4.4,4.3
               C3.2,6.2 1.8,7.4 0,5.8 Z" fill="#fff"/>
      <path d="M1.2,6.1 C4.1,7.2 6.3,8.7 8.4,7.0
               C6.3,10.1 2.7,9.6 1.2,6.1 Z" fill="#fff"/>
      <circle cx="7.9" cy="1.5" r="0.55" fill="#c92b32"/>
      <path d="M8.3,1.5 l1.45,0.35 l-1.45,0.45 z" fill="#d3a83a"/>
    </g>

    <!-- Bloques de numeración: SOLO PLACEHOLDERS -->
    <g id="numeracion" fill="none" stroke="#fff" stroke-width="0.30">
      <rect x="10.0" y="31.0" width="20.2" height="6.2"/>
      <rect x="10.0" y="39.0" width="20.2" height="6.2"/>
      <rect x="10.0" y="47.0" width="20.2" height="6.2"/>
      <rect x="10.0" y="55.0" width="20.2" height="6.2"/>
    </g>
    <g id="digitosDemo" fill="#fff" font-family="Arial, Helvetica, sans-serif"
       font-size="4.7" letter-spacing="0.75">
      <text x="11.6" y="35.65">0000</text>
      <text x="11.6" y="43.65">0000</text>
      <text x="11.6" y="51.65">0000</text>
      <text x="11.6" y="59.65">0000</text>
    </g>

    <!-- Marca genérica y leyenda -->
    <g id="marcaFrontal" fill="#fff" font-family="Arial, Helvetica, sans-serif">
      <text x="10.0" y="69.0" font-size="4.1" font-weight="bold">MARCA DEMO</text>
      <text x="10.0" y="73.0" font-size="2.15">FABRICADA CON MATERIAL RECICLADO</text>
      <text x="10.0" y="76.2" font-size="1.75">PLANTILLA • CORELDRAW X8</text>
    </g>

    <!-- Texto vertical de contacto, claramente de maqueta -->
    <text x="45.8" y="80.8" fill="#fff" font-family="Arial, Helvetica, sans-serif"
          font-size="1.65" transform="rotate(-90 45.8 80.8)">
      CONTACTO DEMO • NO VÁLIDA PARA PAGOS
    </text>
    <text x="52.0" y="85.2" fill="#666" font-family="Arial, Helvetica, sans-serif"
          font-size="1.25" transform="rotate(-90 52 85.2)">
      DATOS FICTICIOS
    </text>

    <!-- Etiqueta técnica -->
    <text x="5" y="94.5" fill="#555" font-family="Arial, Helvetica, sans-serif"
          font-size="2.1">FRONTAL • 53.98 × 85.60 mm • ESCALA 1:1</text>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="REVERSO" id="layerBack" transform="translate(-5,0)">
    <!-- Tarjeta reverso -->
    <rect x="67" y="5" width="53.98" height="85.60" rx="3.2"
          fill="url(#gradBack)" filter="url(#softShadow)"/>

    <!-- Marca genérica superior, inspirada en la composición -->
    <rect x="71.3" y="10.0" width="24.0" height="7.2" rx="0.8"
          fill="none" stroke="#fff" stroke-width="0.45"/>
    <circle cx="75.1" cy="13.6" r="1.9" fill="none" stroke="#fff" stroke-width="0.35"/>
    <path d="M75.1,11.8 v3.6 M73.9,13.1 h2.4" stroke="#fff" stroke-width="0.35"/>
    <text x="78.0" y="15.0" fill="#fff" font-family="Georgia, serif"
          font-size="4.1">BANCO DEMO</text>

    <!-- Nombre y código ficticios -->
    <g id="datosTitular" fill="#fff" font-family="Arial, Helvetica, sans-serif">
      <text x="71.0" y="51.5" font-size="3.0">NOMBRE APELLIDO</text>
      <text x="71.0" y="55.4" font-size="2.6">000</text>
    </g>

    <!-- Contactless -->
    <g id="contactless" fill="none" stroke="#fff" stroke-width="0.65"
       stroke-linecap="round">
      <path d="M72.5,69.4 Q76.0,65.8 79.5,69.4"/>
      <path d="M74.0,71.1 Q76.0,69.0 78.0,71.1"/>
      <path d="M75.3,72.5 Q76.0,71.8 76.7,72.5"/>
    </g>

    <!-- Chip vectorial -->
    <g id="chip" transform="translate(82.0 65.6)">
      <rect x="0" y="0" width="10.8" height="8.4" rx="1.15"
            fill="#c9a33b" stroke="#705b24" stroke-width="0.28"/>
      <path d="M5.4,0 V8.4 M0,4.2 H10.8
               M2.3,0 V2.0 H8.5 V0
               M2.3,8.4 V6.4 H8.5 V8.4"
            fill="none" stroke="#705b24" stroke-width="0.30"/>
    </g>

    <!-- Marca de pago genérica -->
    <g id="marcaPago" fill="#fff" font-family="Arial, Helvetica, sans-serif">
      <text x="99.0" y="72.0" font-size="7.1" font-weight="bold">PAGO</text>
      <text x="101.8" y="75.4" font-size="2.45">DÉBITO DEMO</text>
    </g>

    <text x="67" y="94.5" fill="#555" font-family="Arial, Helvetica, sans-serif"
          font-size="2.1">REVERSO • 53.98 × 85.60 mm • ESCALA 1:1</text>
  </g>

  <!-- Guías técnicas -->
  <g inkscape:groupmode="layer" inkscape:label="GUIAS" id="layerGuides"
     fill="none" stroke="#888" stroke-width="0.15" stroke-dasharray="1,1">
    <rect x="5" y="5" width="53.98" height="85.60"/>
    <rect x="62" y="5" width="53.98" height="85.60"/>
  </g>

  <!-- Marca general de seguridad de la maqueta -->
  <text x="43" y="101" fill="#888" font-family="Arial, Helvetica, sans-serif"
        font-size="2.0">MAQUETA VECTORIAL • DATOS FICTICIOS • NO UTILIZAR COMO TARJETA REAL</text>
</svg>
